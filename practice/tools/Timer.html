<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timer · Atomic Forge</title><link rel="icon" href="../../atomic-forge-favicon.png"><link rel="stylesheet" href="pages.css"><link rel="stylesheet" href="menu.css"><link rel="stylesheet" href="timer.css"><link rel="manifest" href="timer.webmanifest"><script defer src="menu.js"></script><script defer src="timer.js"></script></head>
<body><header><a class="brand" href="../../index.html"><img src="../../atomic-forge-logo.png" alt="">Atomic Forge</a><nav class="tool-nav" aria-label="Tools"><button type="button" aria-expanded="false" aria-controls="tool-links">Tool</button><div id="tool-links" hidden><a href="Oxalate.html">Oxalate</a><a href="Timer.html">Timer</a></div></nav></header><main class="timer"><h1 id="mode-title">Timer</h1>
<nav class="mode-switch" aria-label="Clock mode"><button id="timer-tab" aria-pressed="true">Timer</button><button id="watch-tab" aria-pressed="false">Stopwatch</button></nav>
<section id="countdown"><div class="dial"><div class="face" role="timer" aria-label="Time remaining"><span class="digits" id="minutes">05</span><span class="digits" id="seconds">00</span><small>MIN / SEC</small></div></div><div class="controls"><button id="toggle">Start</button><button id="cancel" disabled>Cancel</button></div><div class="preset-head"><h2>Presets</h2><button class="icon-key" id="edit" title="Edit presets" aria-label="Edit presets" aria-pressed="false"><span aria-hidden="true">✎</span></button></div>
<div class="presets" aria-label="Timer presets"></div><p id="status" role="status"></p>
<details class="sound-bank"><summary>Alarm sound</summary>
<label for="ringer">Ringer</label><select id="ringer"><option value="beacon">Orbital beacon</option><option value="crystal">Crystal chime</option><option value="arcade">Arcade fanfare</option></select>
<label for="track">Audio file for this visit</label><input id="track" type="file" accept="audio/*,.m4a,.m4r">
<button id="preview" class="secondary">Preview sound</button> <button id="alerts" class="secondary">Enable notifications</button>
<p id="sound-note" role="status"></p><small>Keep the timer open for the alarm. On iPhone, notification access requires the Home Screen app.</small></details>
<dialog id="editor"><form id="preset-form"><h2 id="edit-title">Edit preset</h2>
<label>Minutes<input id="preset-min" type="number" min="0" max="999" step="1" required></label>
<label>Seconds<input id="preset-sec" type="number" min="0" max="59" step="1" required></label>
<div class="controls"><button>Save</button><button type="button" id="dismiss">Cancel</button></div></form></dialog>
<p id="save-note" role="status"></p></section>
<section id="stopwatch" hidden><div class="dial"><div class="face" role="timer" aria-label="Elapsed time"><span class="digits" id="elapsed-min">00</span><span class="digits" id="elapsed-sec">00.0</span><small>MIN / SEC</small></div></div>
<div class="controls"><button id="watch-toggle">Start</button><button id="watch-reset" disabled>Reset</button></div></section></main></body></html>
