      if (!noiseBuf) {
        noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.2, audioCtx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      return noiseBuf;
    }

    function metroClick(when, accented) {
      const out = audioCtx.destination;
      const vol = accented ? 1.0 : 0.65;

      if (state.metroSound === 'woodblock') {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(accented ? 1900 : 1600, when);
        const bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 1700;
        bp.Q.value = 8;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.9 * vol, when);
        g.gain.exponentialRampToValueAtTime(0.001, when + 0.07);
        osc.connect(bp); bp.connect(g); g.connect(out);
        osc.start(when); osc.stop(when + 0.09);
      } else if (state.metroSound === 'duck') {
        const osc = audioCtx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(accented ? 560 : 500, when);
        osc.frequency.exponentialRampToValueAtTime(accented ? 230 : 200, when + 0.13);
        const bp = audioCtx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.Q.value = 2.5;
        bp.frequency.setValueAtTime(800, when);
        bp.frequency.exponentialRampToValueAtTime(1900, when + 0.05);
        bp.frequency.exponentialRampToValueAtTime(850, when + 0.14);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.001, when);
        g.gain.exponentialRampToValueAtTime(0.9 * vol, when + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, when + 0.17);
        osc.connect(bp); bp.connect(g); g.connect(out);
        osc.start(when); osc.stop(when + 0.2);
      } else if (state.metroSound === 'cowbell') {
        [587, 845].forEach(f => {
          const osc = audioCtx.createOscillator();
          osc.type = 'square';
          osc.frequency.value = f;
          const g = audioCtx.createGain();
          g.gain.setValueAtTime(0.3 * vol, when);
          g.gain.exponentialRampToValueAtTime(0.001, when + 0.25);
          osc.connect(g); g.connect(out);
          osc.start(when); osc.stop(when + 0.3);
        });
      } else if (state.metroSound === 'rim') {
        const src = audioCtx.createBufferSource();
        src.buffer = getNoise();
        const hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 2200;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.8 * vol, when);
        g.gain.exponentialRampToValueAtTime(0.001, when + 0.035);
        src.connect(hp); hp.connect(g); g.connect(out);
        src.start(when); src.stop(when + 0.05);
      } else if (state.metroSound === 'hat') {
        const src = audioCtx.createBufferSource();
        src.buffer = getNoise();
        const hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 8000;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.6 * vol, when);
        g.gain.exponentialRampToValueAtTime(0.001, when + 0.05);
        src.connect(hp); hp.connect(g); g.connect(out);
        src.start(when); src.stop(when + 0.07);
      } else { // beep
        const osc = audioCtx.createOscillator();
        osc.type = 'square';
        osc.frequency.value = accented ? 1200 : 900;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.25 * vol, when);
        g.gain.exponentialRampToValueAtTime(0.001, when + 0.07);
        osc.connect(g); g.connect(out);
        osc.start(when); osc.stop(when + 0.09);
      }
    }

    let metroTimer = null;
    let nextClickTime = 0;
    let clickBeat = 0;

    function startMetronome() {
      ensureAudio();
      clickBeat = 0;
      nextClickTime = audioCtx.currentTime + 0.1;
      metroTimer = setInterval(() => {
        while (nextClickTime < audioCtx.currentTime + 0.25) {
          metroClick(nextClickTime, clickBeat % 4 === 0);
          nextClickTime += beatSec();
          clickBeat++;
        }
      }, 60);
    }

    function stopMetronome() {
      if (metroTimer) { clearInterval(metroTimer); metroTimer = null; }
    }

    // --- ROOT DRONE (warm pad sustains the current chord root) ---
    async function startDrone() {
      const pad = await getPadInstrument();
      stopDroneNote();
      const rootPc = chordRootPcOf(state.degreeIndex);
      droneNote = pad.play(36 + rootPc, audioCtx.currentTime);
    }

    function stopDroneNote() {
      if (droneNote) {
        try { droneNote.stop(); } catch (e) {}
        droneNote = null;
      }
    }

    // --- AUDIO EVENT LISTENERS ---
    document.getElementById('instrumentSelect').addEventListener('change', (e) => {
      state.instrument = e.target.value;
    });

    document.getElementById('playBlockBtn').addEventListener('click', () => {
      state.playStyle = 'block';
      document.getElementById('playBlockBtn').classList.add('active');
      document.getElementById('playArpBtn').classList.remove('active');
    });

    document.getElementById('playArpBtn').addEventListener('click', () => {
      state.playStyle = 'arp';
      document.getElementById('playArpBtn').classList.add('active');
      document.getElementById('playBlockBtn').classList.remove('active');
    });

    document.getElementById('playChordBtn').addEventListener('click', () => { ensureAudio(); playChordNow(); });
    document.getElementById('playRunBtn').addEventListener('click', () => { ensureAudio(); playRunNow(); });

    document.getElementById('metroBtn').addEventListener('click', () => {
      state.metroOn = !state.metroOn;
      document.getElementById('metroBtn').classList.toggle('metro-on', state.metroOn);
      if (state.metroOn) startMetronome(); else stopMetronome();
    });

    document.getElementById('bpmInput').addEventListener('input', (e) => {
      const v = parseInt(e.target.value);
      if (v >= 40 && v <= 240) state.bpm = v;
    });

    document.getElementById('metroSoundSelect').addEventListener('change', (e) => {
      state.metroSound = e.target.value;
    });

    document.getElementById('droneOnBtn').addEventListener('click', () => {
      state.droneOn = true;
      document.getElementById('droneOnBtn').classList.add('active');
      document.getElementById('droneOffBtn').classList.remove('active');
      ensureAudio();
      startDrone();
    });

    document.getElementById('droneOffBtn').addEventListener('click', () => {
      state.droneOn = false;
      document.getElementById('droneOffBtn').classList.add('active');
      document.getElementById('droneOnBtn').classList.remove('active');
      stopDroneNote();
    });

    document.getElementById('inversionSelect').addEventListener('change', (e) => {
      state.inversion = e.target.value;
      updateApp();
    });

    document.getElementById('runOrderSelect').addEventListener('change', (e) => {
      state.runOrder = e.target.value;
      updateApp();
    });

    updateApp();
  </script>
</body>
</html>
