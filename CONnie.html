<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CONnie - M4A to MP3 Converter</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- lamejs for pure client-side MP3 encoding -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
  <style>
    :root {
      --bg: #0f0f11;
      --card-bg: #1a1a1e;
      --card-hover: #242429;
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.15);
      --text: #f5f5f7;
      --muted: #8e8e93;
      --border: #2c2c2e;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }
    .custom-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
    }
    .accent-btn {
      background: var(--accent);
      color: #000;
      transition: all 0.2s ease;
    }
    .accent-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

  <!-- Header -->
  <header class="w-full max-w-xl pb-6 border-b border-[#2c2c2e] flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
        <span>🔄</span> CONnie
      </h1>
      <p class="text-sm text-gray-400 mt-1">Convert iPhone .m4a Voice Memos to .mp3 instantly</p>
    </div>
    <a href="index.html" class="text-xs px-3 py-1.5 rounded-lg bg-[#242429] border border-[#2c2c2e] text-gray-300 hover:text-white transition">
      ← Hub
    </a>
  </header>

  <!-- Main Converter Interface -->
  <main class="w-full max-w-xl my-8 flex flex-col gap-6">
    
    <!-- Dropzone / File Picker wrapped in a real label for 100% reliable iOS/mobile triggering -->
    <label for="file-input" id="drop-zone" class="custom-card rounded-2xl p-8 border-2 border-dashed border-[#3a3a3c] text-center cursor-pointer hover:border-[#00d2ff] transition flex flex-col items-center justify-center gap-4 block">
      <div class="w-16 h-16 rounded-full bg-[#00d2ff]/10 border border-[#00d2ff]/30 flex items-center justify-center text-3xl pointer-events-none">
        🎙️
      </div>
      <div class="pointer-events-none">
        <h3 class="text-lg font-semibold text-white">Tap or Drop your .m4a file here</h3>
        <p class="text-xs text-gray-400 mt-1">Supports iPhone Voice Memos, GarageBand exports, and audio files</p>
      </div>
      <!-- Hidden file input with direct association -->
      <input type="file" id="file-input" accept=".m4a,audio/mp4,audio/*,.mp3,.wav" class="hidden">
      <span class="px-5 py-2.5 rounded-xl font-semibold text-sm accent-btn shadow-lg inline-block pointer-events-none">
        Select Audio File
      </span>
    </label>

    <!-- File Info & Progress Panel -->
    <div id="status-panel" class="custom-card rounded-2xl p-6 hidden flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-2xl">🎵</span>
          <div>
            <h4 id="file-name" class="font-semibold text-white text-sm truncate max-w-[240px]">filename.m4a</h4>
            <span id="file-size" class="text-xs text-gray-400">0 MB</span>
          </div>
        </div>
        <span id="conversion-status" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30">
          Ready to convert
        </span>
      </div>

      <!-- Progress Bar -->
      <div class="w-full bg-[#2c2c2e] h-2 rounded-full overflow-hidden hidden" id="progress-container">
        <div id="progress-bar" class="bg-[#00d2ff] h-full w-0 transition-all duration-300"></div>
      </div>

      <!-- Action Buttons & Preview -->
      <div id="action-area" class="flex flex-col gap-3 mt-2">
        <button id="convert-btn" class="w-full py-3 rounded-xl font-semibold text-sm accent-btn flex items-center justify-center gap-2">
          <span>⚙️</span> Convert to MP3
        </button>
        
        <div id="result-area" class="hidden flex flex-col gap-3">
          <audio id="audio-preview" controls class="w-full rounded-xl"></audio>
          <a id="download-btn" class="w-full py-3 rounded-xl font-semibold text-sm bg-emerald-500 text-black hover:bg-emerald-400 text-center transition flex items-center justify-center gap-2">
            <span>⬇️</span> Download Converted .MP3
          </a>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-xl text-center text-xs text-gray-500 pt-4 border-t border-[#2c2c2e]">
    Atomic Forge Collection • 100% Client-Side Conversion
  </footer>

  <!-- Converter Logic Script -->
  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const statusPanel = document.getElementById('status-panel');
    const fileNameEl = document.getElementById('file-name');
    const fileSizeEl = document.getElementById('file-size');
    const conversionStatus = document.getElementById('conversion-status');
    const convertBtn = document.getElementById('convert-btn');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const resultArea = document.getElementById('result-area');
    const audioPreview = document.getElementById('audio-preview');
    const downloadBtn = document.getElementById('download-btn');

    let selectedFile = null;

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-[#00d2ff]');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-[#00d2ff]');
    });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-[#00d2ff]');
      if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      selectedFile = file;
      fileNameEl.textContent = file.name;
      fileSizeEl.textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
      statusPanel.classList.remove('hidden');
      resultArea.classList.add('hidden');
      convertBtn.classList.remove('hidden');
      conversionStatus.textContent = 'Ready to convert';
      conversionStatus.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30';
    }

    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      convertBtn.disabled = true;
      convertBtn.style.opacity = '0.5';
      progressContainer.classList.remove('hidden');
      progressBar.style.width = '20%';
      conversionStatus.textContent = 'Decoding audio...';
      conversionStatus.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/30';

      try {
        const arrayBuffer = await selectedFile.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        progressBar.style.width = '50%';
        conversionStatus.textContent = 'Processing waveform...';

        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        
        progressBar.style.width = '75%';
        conversionStatus.textContent = 'Encoding to MP3...';

        const mp3Blob = encodeAudioBufferToMp3(audioBuffer);

        progressBar.style.width = '100%';
        conversionStatus.textContent = 'Conversion Complete!';
        conversionStatus.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';

        const audioUrl = URL.createObjectURL(mp3Blob);
        audioPreview.src = audioUrl;
        
        const baseName = selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.')) || selectedFile.name;
        downloadBtn.download = `${baseName}_converted.mp3`;
        downloadBtn.href = audioUrl;

        convertBtn.classList.add('hidden');
        resultArea.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        conversionStatus.textContent = 'Conversion failed (Unsupported format)';
        conversionStatus.className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/30';
        convertBtn.disabled = false;
        convertBtn.style.opacity = '1';
      }
    });

    function encodeAudioBufferToMp3(audioBuffer) {
      const channels = audioBuffer.numberOfChannels;
      const sampleRate = audioBuffer.sampleRate;
      const samples = audioBuffer.getChannelData(0);

      const mp3encoder = new lamejs.Mp3Encoder(channels === 2 ? 2 : 1, sampleRate, 128);
      const sampleBlockSize = 1152;
      const mp3Data = [];

      const left = audioBuffer.getChannelData(0);
      const right = channels > 1 ? audioBuffer.getChannelData(1) : left;

      const maxSamples = left.length;
      const leftSamples = new Int16Array(maxSamples);
      const rightSamples = new Int16Array(maxSamples);

      for (let i = 0; i < maxSamples; i++) {
        leftSamples[i] = Math.max(-1, Math.min(1, left[i])) < 0 ? left[i] * 32768 : left[i] * 32767;
        rightSamples[i] = Math.max(-1, Math.min(1, right[i])) < 0 ? right[i] * 32768 : right[i] * 32767;
      }

      let remaining = maxSamples;
      let index = 0;
      while (remaining >= sampleBlockSize) {
        const chunkLeft = leftSamples.subarray(index, index + sampleBlockSize);
        const chunkRight = rightSamples.subarray(index, index + sampleBlockSize);
        
        const mp3buf = channels === 2 
          ? mp3encoder.encodeBuffer(chunkLeft, chunkRight)
          : mp3encoder.encodeBuffer(chunkLeft);

        if (mp3buf.length > 0) {
          mp3Data.push(new Int8Array(mp3buf));
        }
        index += sampleBlockSize;
        remaining -= sampleBlockSize;
      }

      const mp3buf = mp3encoder.flush();
      if (mp3buf.length > 0) {
        mp3Data.push(new Int8Array(mp3buf));
      }

      return new Blob(mp3Data, { type: 'audio/mp3' });
    }
  </script>
</body>
</html>
