<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhythm Magic · Atomic Forge</title><link rel="icon" href="atomic-forge-favicon.png"><link rel="stylesheet" href="practice/practice.css"></head>
<body><main><header><a href="index.html"><img src="atomic-forge-logo.png" alt="">Atomic Forge</a></header><h1>Rhythm Magic</h1>
<div class="wavebox"><canvas class="wave" id="wave" aria-hidden="true"></canvas><input id="waveColour" type="color" aria-label="Wave colour" title="Change wave colour"></div>
<section class="panel"><div class="row"><label>BPM<input id="bpm" type="number" value="96" min="30" max="300"></label><button id="tap">Tap tempo</button><label>Meter<select id="meter"><option>4</option><option>3</option><option>5</option><option>7</option></select></label><label>Swing<select id="swing"><option value=".5">Straight</option><option value=".58">Light swing</option><option value=".667">Shuffle</option><option value=".72">Deep shuffle</option></select></label></div>
<div class="beats" id="beats" aria-hidden="true"></div><div class="row"><button class="primary" id="play">Start</button><strong id="phase" role="status">Ready</strong></div></section>
<section class="panel"><h2>Dropout cycle</h2><div class="row"><label>Band plays · bars<input id="on" type="number" min="1" max="32" value="4"></label><label>Dropout · bars<input id="off" type="number" min="0" max="32" value="2"></label><label>Click placement<select id="click"><option value="all">Every beat</option><option value="back">Beats 2 and 4</option><option value="last">Last beat only</option><option value="none">Off</option></select></label></div>
<p>Keep during dropout</p><div class="row"><label><span><input id="keepKick" type="checkbox"> Kick</span></label><label><span><input id="keepSnare" type="checkbox"> Snare</span></label><label><span><input id="keepHat" type="checkbox"> Hi-hat</span></label><label><span><input id="keepClick" type="checkbox"> Click</span></label><label><span><input id="visual" type="checkbox"> Show beats during dropout</span></label></div></section>
</main><script src="practice/common.js"></script><script src="practice/rhythm.js"></script></body></html>
