<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Triad Machine — Atomic Forge</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      color-scheme: dark;
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --panel-border: #334155;
      --accent-primary: #3b82f6;
      --accent-hover: #2563eb;
      --lime: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --line: #334155;
      --root: #ef4444;
      --third: #22c55e;
      --fifth: #f97316;
      --seventh: #a855f7;
      --scale: rgba(148, 163, 184, 0.35);
      --shadow: 0 22px 60px #0005;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; padding: 12px; overflow-x: hidden; }

    /* Force landscape view prompt overlay on small portrait screens */
    @media screen and (max-width: 900px) and (orientation: portrait) {
      body::before {
        content: "🔄 Please rotate your device to LANDSCAPE view for the optimal fretboard experience.";
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(15, 23, 42, 0.96); color: #f8fafc; z-index: 9999;
        display: flex; align-items: center; justify-content: center; padding: 30px;
        text-align: center; font-size: 18px; font-weight: 700; line-height: 1.5; backdrop-filter: blur(8px);
      }
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--panel-border); }
    .logo-container { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-main); }
    .logo-icon { font-size: 20px; color: var(--accent-primary); }
    h1 { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; white-space: nowrap; }
    .subtitle { font-size: 11px; color: var(--text-muted); display: none; }
    @media (min-width: 768px) { .subtitle { display: block; } }

    .header-actions { display: flex; gap: 6px; }
    .btn-hdr { padding: 6px 10px; font-size: 11px; border-radius: 6px; }
    .button, .btn { padding: 6px 10px; background-color: var(--accent-primary); color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.2s; white-space: nowrap; }
    .button:hover, .btn:hover { background-color: var(--accent-hover); }
    .btn-secondary { background-color: transparent; border: 1px solid var(--panel-border); color: var(--text-main); }
    .btn-secondary:hover { background-color: rgba(255, 255, 255, 0.05); }

    .archive-menu { position: relative; }
    .archive-menu summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--panel-border); border-radius: 6px; background: var(--panel-bg); color: var(--text-main); font-size: 11px; font-weight: 600; white-space: nowrap; }
    .archive-menu summary::-webkit-details-marker { display: none; }
    .archive-menu summary:hover, .archive-menu[open] summary { border-color: var(--accent-primary); }
    .archive-menu-pop { position: absolute; z-index: 20; right: 0; top: calc(100 + 6px); min-width: 180px; padding: 6px; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; box-shadow: var(--shadow); }
    .archive-menu-pop a { display: block; padding: 8px 10px; border-radius: 6px; color: var(--text-main); text-decoration: none; font-size: 11px; }
    .archive-menu-pop a:hover { background: rgba(59, 130, 246, 0.15); color: var(--accent-primary); }

    .app-layout { display: flex; flex-direction: column; gap: 8px; flex: 1; }

    /* COMPACT CONTROLS BAR */
    .compact-controls-bar {
      background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px;
      padding: 6px 10px; display: flex; align-items: center; gap: 10px; overflow-x: auto; white-space: nowrap; scrollbar-width: thin;
    }
    .compact-controls-bar::-webkit-scrollbar { height: 4px; }
    .compact-controls-bar::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 4px; }

    .ctrl-item { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .ctrl-item label { font-size: 11px; font-weight: 700; color: var(--text-main); margin: 0; }
    select, input[type="number"] { background-color: var(--bg-dark); border: 1px solid var(--panel-border); color: var(--text-main); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; outline: none; }
    
    .toggle-group { display: flex; gap: 2px; background: var(--bg-dark); padding: 2px; border-radius: 6px; border: 1px solid var(--panel-border); }
    .btn-toggle { padding: 3px 8px; background: transparent; border: none; color: var(--text-muted); border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px; transition: all 0.2s; }
    .btn-toggle.active { background: var(--accent-primary); color: white; }

    .divider { width: 1px; height: 18px; background-color: var(--panel-border); margin: 0 4px; }

    .main-content { display: flex; flex-direction: column; gap: 10px; }
    .fretboard-card { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .fretboard-header { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
    .chord-info h2 { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .chord-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; font-weight: 600; }

    .canvas-container { width: 100%; background-color: #000; border-radius: 6px; overflow-x: auto; border: 1px solid var(--panel-border); padding: 4px; }
    canvas { display: block; margin: 0 auto; max-width: 100%; height: auto; }

    .controls-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .stepper-group { display: flex; align-items: center; gap: 4px; }
    .degree-buttons { display: flex; gap: 2px; overflow-x: auto; }
    .btn-degree { padding: 6px 10px; background: var(--bg-dark); border: 1px solid var(--panel-border); color: var(--text-main); border-radius: 5px; cursor: pointer; font-weight: 700; font-size: 11px; transition: all 0.2s; min-width: 36px; }
    .btn-degree.active { background: var(--accent-primary); border-color: var(--accent-primary); }

    .legend { display: flex; gap: 10px; padding: 6px 10px; background: var(--bg-dark); border-radius: 6px; border: 1px solid var(--panel-border); font-size: 10px; font-weight: 600; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    .panel { background-color: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 8px; padding: 12px; }
    .panel-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }

    .voicing-selector { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; max-height: 160px; overflow-y: auto; }
    .voicing-card { background: var(--bg-dark); border: 1px solid var(--panel-border); border-radius: 6px; padding: 8px; cursor: pointer; transition: all 0.2s; }
    .voicing-card:hover { border-color: var(--accent-primary); }
    .voicing-card.active { border-color: var(--accent-primary); background: rgba(59, 130, 246, 0.1); }
    .voicing-card .title { font-size: 11px; font-weight: 700; margin-bottom: 2px; }
    .voicing-card .frets { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); }

    .favorites-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .favorite-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bg-dark); border-radius: 6px; border: 1px solid var(--panel-border); font-size: 11px; white-space: nowrap; }
    .favorite-item .actions { display: flex; gap: 4px; }
    .icon-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; padding: 2px; }
    .icon-btn:hover { color: var(--text-main); }
    .icon-btn.delete:hover { color: var(--root); }

    .triad-legend-bar, .notes-row-bar { display: flex; gap: 6px; flex-wrap: wrap; background: var(--bg-dark); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--panel-border); align-items: center; }
    .triad-tag { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; color: #fff; }
    .note-pill { display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; background: #1e293b; border: 1px solid var(--panel-border); color: #f8fafc; font-family: 'JetBrains Mono', monospace; }
    .note-pill span.sub { font-size: 9px; color: var(--text-muted); font-family: 'Inter', sans-serif; }
    .audio-status { font-size: 10px; color: var(--text-muted); margin-top: 4px; }
  </style>
</head>
<body>

  <header>
    <a class="logo-container" href="#">
      <i class="fa-solid fa-bolt logo-icon"></i>
      <div>
        <h1>The Atomic Forge Triad Machine</h1>
        <div class="subtitle">Interactive Diatonic, Scale & Range Explorer</div>
      </div>
    </a>
    <details class="archive-menu">
      <summary>Archived versions <span aria-hidden="true">▾</span></summary>
      <div class="archive-menu-pop"><a href="TriadMachineOriginal.html">Triad Machine · Original</a></div>
    </details>
    <div class="header-actions">
      <button class="btn btn-secondary btn-hdr" id="saveFavBtn" type="button"><i class="fa-solid fa-star"></i> Save</button>
      <button class="btn btn-hdr" id="downloadBtn" type="button"><i class="fa-solid fa-download"></i> Export</button>
    </div>
  </header>

  <div class="app-layout">
    
    <!-- COMPACT HORIZONTAL CONTROLS BAR MATCHING REFERENCE -->
    <div class="compact-controls-bar">
      
      <!-- Scale Root -->
      <div class="ctrl-item">
        <label>Root:</label>
        <select id="scaleRootSelect">
          <option value="AUTO" selected>Auto</option>
          <option value="0">C</option>
          <option value="1">C# / Db</option>
          <option value="2">D</option>
          <option value="3">D# / Eb</option>
          <option value="4">E</option>
          <option value="5">F</option>
          <option value="6">F# / Gb</option>
          <option value="7">G</option>
          <option value="8">G# / Ab</option>
          <option value="9">A</option>
          <option value="10">A# / Bb</option>
          <option value="11">B</option>
        </select>
      </div>

      <!-- Scale Select -->
      <div class="ctrl-item">
        <select id="scaleSelect" style="max-width:140px;">
          <option value="ionian" selected>Ionian (Major)</option>
          <option value="dorian">Dorian</option>
          <option value="phrygian">Phrygian</option>
          <option value="lydian">Lydian</option>
          <option value="mixolydian">Mixolydian</option>
          <option value="aeolian">Aeolian (Minor)</option>
          <option value="locrian">Locrian</option>
          <option value="pentatonic_major">Maj Pentatonic</option>
          <option value="pentatonic_minor">Min Pentatonic</option>
          <option value="harmonic_minor">Harmonic Minor</option>
          <option value="melodic_minor">Melodic Minor</option>
          <option value="blues">Blues</option>
        </select>
      </div>

      <div class="divider"></div>

      <!-- 8 Diatonic Triads Toggle -->
      <div class="ctrl-item">
        <label>8 Diatonic Triads (I-VIII):</label>
        <div class="toggle-group">
          <button class="btn-toggle active" id="diatonicOffBtn" type="button">Off</button>
          <button class="btn-toggle" id="diatonicOnBtn" type="button">On</button>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Fret Range Limit -->
      <div class="ctrl-item">
        <label>Range Limit:</label>
        <div class="toggle-group">
          <button class="btn-toggle active" id="rangeOffBtn" type="button">Full Neck</button>
          <button class="btn-toggle" id="rangeOnBtn" type="button">Filter</button>
        </div>
      </div>

      <div class="ctrl-item" id="rangeControls" style="display:none;">
        <label>Start:</label>
        <input type="number" id="startFretInput" min="0" max="15" value="3" style="width:40px;">
        <label>Span:</label>
        <input type="number" id="fretSpanInput" min="3" max="15" value="5" style="width:40px;">
      </div>

      <div class="divider"></div>

      <!-- Key & Mode and Quality hidden controls needed for core logic -->
      <div class="ctrl-item" style="display:none;">
        <select id="keySelect"></select>
        <select id="chordTypeSelect">
          <option value="triad" selected>Triads</option>
          <option value="dom7">Dominant 7</option>
          <option value="maj7">Major 7</option>
          <option value="9th">9th</option>
          <option value="sus4">Sus4</option>
          <option value="sus2">Sus2</option>
          <option value="6th">6th</option>
        </select>
        <select id="instrumentSelect"><option value="acoustic_grand_piano" selected>Piano</option></select>
      </div>
    </div>

    <!-- MAIN FRETBOARD AREA -->
    <div class="main-content">
      
      <div class="fretboard-card">
        <div class="fretboard-header">
          <div class="chord-info">
            <h2 id="chordTitle">G Maj <span class="chord-badge" id="chordDegreeBadge">I Degree</span></h2>
          </div>
          <div class="legend">
            <div class="legend-item" id="legendRoot"><div class="legend-dot" style="background: var(--root)"></div> Root</div>
            <div class="legend-item" id="legendThird"><div class="legend-dot" style="background: var(--third)"></div> 3rd</div>
            <div class="legend-item" id="legendFifth"><div class="legend-dot" style="background: var(--fifth)"></div> 5th</div>
            <div class="legend-item" id="legendSeventh" style="display:none;"><div class="legend-dot" style="background: var(--seventh)"></div> Ext</div>
          </div>
        </div>

        <div class="canvas-container">
          <canvas id="fretboardCanvas" width="1100" height="220"></canvas>
        </div>

        <!-- 8 DIATONIC TRIADS COLOR KEY & NOTE NAMES BAR -->
        <div id="triadLegendContainer" style="display:none;">
          <div class="triad-legend-bar" id="triadLegendBar"></div>
          <div class="notes-row-bar" id="notesRowBar" style="margin-top:4px;"></div>
        </div>

        <div class="controls-bar">
          <div class="stepper-group">
            <button class="btn btn-secondary" id="prevChordBtn" type="button" style="padding: 6px 10px;"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="degree-buttons" id="degreeButtons"></div>
            <button class="btn btn-secondary" id="nextChordBtn" type="button" style="padding: 6px 10px;"><i class="fa-solid fa-chevron-right"></i></button>
          </div>

          <button class="btn" id="cycleVoicingBtn" type="button" style="padding: 6px 12px;">
            <i class="fa-solid fa-arrows-rotate"></i> Swap Inversion / Position
          </button>
        </div>
      </div>

      <!-- SAVED FAVORITES QUICK BAR -->
      <div class="panel" style="padding: 8px 12px;">
        <div class="panel-title" style="margin-bottom: 6px;"><i class="fa-solid fa-star"></i> Favorites</div>
        <div class="favorites-list" id="favoritesList">
          <div style="font-size: 11px; color: var(--text-muted);">No saved positions yet</div>
        </div>
      </div>

      <!-- ALL PLAYABLE VOICINGS SECTION -->
      <div class="panel">
        <div class="panel-title"><i class="fa-solid fa-list-check"></i> All Playable Voicings (Ranked by Ease)</div>
        <div class="voicing-selector" id="voicingContainer"></div>
      </div>

    </div>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="TriadMachineSoundfont.js"></script>
  <script>
    const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const TUNING = [4, 11, 7, 2, 9, 4]; // E4, B3, G3, D3, A2, E2
    const STRING_NAMES = ['e', 'B', 'G', 'D', 'A', 'E'];
    const MAJOR_SCALE = [0, 2, 4, 5, 7, 9, 11];
    const ROMAN_MAJOR = ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°', 'VIII'];
    
    const TRIAD_COLORS = [
      '#ef4444', // Red (I)
      '#f97316', // Orange (ii)
      '#eab308', // Yellow (iii)
      '#22c55e', // Green (IV)
      '#06b6d4', // Cyan (V)
      '#3b82f6', // Blue (vi)
      '#a855f7', // Purple (vii°)
      '#ec4899'  // Pink (VIII)
    ];

    const MODE_INTERVALS = {
      'ionian': [0, 2, 4, 5, 7, 9, 11],
      'dorian': [0, 2, 3, 5, 7, 9, 10],
      'phrygian': [0, 1, 3, 5, 7, 8, 10],
      'lydian': [0, 2, 4, 6, 7, 9, 11],
      'mixolydian': [0, 2, 4, 5, 7, 9, 10],
      'aeolian': [0, 2, 3, 5, 7, 8, 10],
      'locrian': [0, 1, 3, 5, 6, 8, 10],
      'pentatonic_major': [0, 2, 4, 7, 9],
      'pentatonic_minor': [0, 3, 5, 7, 10],
      'harmonic_minor': [0, 2, 3, 5, 7, 8, 11],
      'melodic_minor': [0, 2, 3, 5, 7, 9, 11],
      'blues': [0, 3, 5, 6, 7, 10]
    };

    let state = {
      key: 7, // G
      mode: 'major',
      degreeIndex: 0,
      chordType: 'triad',
      voicingIndex: 0,
      labelMode: 'interval',
      showScaleOverlay: true,
      scaleRoot: 'AUTO',
      selectedScale: 'ionian',
      showDiatonicRun: true, // Default enabled matching image
      enableFretRange: false,
      startFret: 0,
      fretSpan: 15,
      favorites: [],
      allowOpen: true
    };

    let audioContext, activeInstrument = null;

    function getNoteName(semitone) { return NOTES[(semitone % 12 + 12) % 12]; }

    function getChordIntervals(degree, mode, type) {
      const scale = MAJOR_SCALE;
      const rootOffset = scale[degree % 7];
      const thirdOffset = (scale[(degree + 2) % 7] + (degree + 2 >= 7 ? 12 : 0)) - rootOffset;
      const fifthOffset = (scale[(degree + 4) % 7] + (degree + 4 >= 7 ? 12 : 0)) - rootOffset;

      return [
        { semitones: 0, name: 'R', type: 'root' },
        { semitones: thirdOffset, name: thirdOffset === 3 ? 'm3' : 'M3', type: 'third' },
        { semitones: fifthOffset, name: fifthOffset === 6 ? 'b5' : '5', type: 'fifth' }
      ];
    }

    function getChordName(keyIdx, degree, mode, type) {
      const scale = MAJOR_SCALE;
      const chordRootIdx = (keyIdx + scale[degree % 7]) % 12;
      const rootName = NOTES[chordRootIdx];
      const intervals = getChordIntervals(degree, mode, type);
      const third = intervals[1].semitones;
      const fifth = intervals[2].semitones;

      let suffix = '';
      if (third === 4 && fifth === 7) suffix = ' Maj';
      else if (third === 3 && fifth === 7) suffix = 'm';
      else if (third === 3 && fifth === 6) suffix = 'dim';
      else if (third === 4 && fifth === 8) suffix = 'aug';
      return rootName + suffix;
    }

    function generateVoicings(keyIdx, degree, mode, type, rangeLimit = false, startF = 0, span = 15) {
      const scale = MAJOR_SCALE;
      const chordRoot = (keyIdx + scale[degree % 7]) % 12;
      const intervals = getChordIntervals(degree, mode, type);
      const targetPitchClasses = intervals.map(i => (chordRoot + i.semitones) % 12);

      let validVoicings = [];
      const stringSets = [[0,1,2], [1,2,3], [2,3,4], [3,4,5]];
      const minF = rangeLimit ? startF : 0;
      const maxF = rangeLimit ? Math.min(15, startF + span) : 15;

      stringSets.forEach(stringGroup => {
        function searchGroup(strIdx, currentFingering) {
          if (strIdx === stringGroup.length) {
            const pcs = currentFingering.map(f => f.pc);
            if (new Set(pcs).size === 3) validVoicings.push([...currentFingering]);
            return;
          }
          const s = stringGroup[strIdx];
          const openNote = TUNING[s];
          for (let f = minF; f <= maxF; f++) {
            const pc = (openNote + f) % 12;
            if (targetPitchClasses.includes(pc)) {
              currentFingering.push({ string: s, fret: f, pc: pc });
              searchGroup(strIdx + 1, currentFingering);
              currentFingering.pop();
            }
          }
        }
        searchGroup(0, []);
      });

      const scored = validVoicings.map(v => {
        const frets = v.map(n => n.fret).filter(f => f > 0);
        const minFret = frets.length > 0 ? Math.min(...frets) : 0;
        const maxFret = frets.length > 0 ? Math.max(...frets) : 0;
        const currentSpan = maxFret - minFret;
        let score = currentSpan;
        if (currentSpan > 4) score += 100;
        score += minFret * 0.2;
        return { notes: v, span: currentSpan, minFret, maxFret, score };
      }).filter(v => v.span <= 5);

      scored.sort((a, b) => a.score - b.score);
      const unique = [];
      const seen = new Set();
      scored.forEach(item => {
        const key = item.notes.map(n => `${n.string}:${n.fret}`).join(',');
        if (!seen.has(key)) { seen.add(key); unique.push(item); }
      });
      return unique;
    }

    function getEightDiatonicTriads(activeVoicing) {
      const stringSetKey = activeVoicing ? activeVoicing.notes.map(n => n.string).sort().join(',') : null;
      let triadsRun = [];
      let lastAvgFret = -1;

      for (let d = 0; d < 8; d++) {
        const degIndex = d % 7;
        let voicings = generateVoicings(state.key, degIndex, state.mode, state.chordType, state.enableFretRange, state.startFret, state.fretSpan);
        
        let matchingVoicings = stringSetKey 
          ? voicings.filter(v => v.notes.map(n => n.string).sort().join(',') === stringSetKey)
          : voicings;
        if (matchingVoicings.length === 0) matchingVoicings = voicings;
        if (matchingVoicings.length === 0) continue;

        let bestVoicing = matchingVoicings[0];
        if (d === 0 && activeVoicing) {
          const activeAvg = activeVoicing.notes.reduce((sum, n) => sum + n.fret, 0) / activeVoicing.notes.length;
          let minDiff = 999;
          matchingVoicings.forEach(v => {
            const avgFret = v.notes.reduce((sum, n) => sum + n.fret, 0) / v.notes.length;
            const diff = Math.abs(avgFret - activeAvg);
            if (diff < minDiff) { minDiff = diff; bestVoicing = v; }
          });
        } else if (lastAvgFret >= 0) {
          let ascendingCandidates = matchingVoicings.filter(v => {
            const avgFret = v.notes.reduce((sum, n) => sum + n.fret, 0) / v.notes.length;
            return avgFret >= lastAvgFret;
          });
          if (ascendingCandidates.length > 0) {
            ascendingCandidates.sort((a, b) => {
              const avgA = a.notes.reduce((sum, n) => sum + n.fret, 0) / a.notes.length;
              const avgB = b.notes.reduce((sum, n) => sum + n.fret, 0) / b.notes.length;
              return avgA - avgB;
            });
            bestVoicing = ascendingCandidates[0];
          } else {
            bestVoicing = matchingVoicings[0];
          }
        }

        lastAvgFret = bestVoicing.notes.reduce((sum, n) => sum + n.fret, 0) / bestVoicing.notes.length;
        
        triadsRun.push({
          degree: d,
          roman: ROMAN_MAJOR[d],
          name: getChordName(state.key, degIndex, state.mode, state.chordType),
          color: TRIAD_COLORS[d],
          notes: bestVoicing.notes
        });
      }
      return triadsRun;
    }

    const canvas = document.getElementById('fretboardCanvas');
    const ctx = canvas.getContext('2d');

    function renderFretboard(voicing) {
      const dpr = window.devicePixelRatio || 1;
      const width = 1100, height = 220;
      canvas.width = width * dpr; canvas.height = height * dpr; canvas.style.width = '100%';
      ctx.scale(dpr, dpr);

      ctx.fillStyle = '#18181b';
      ctx.fillRect(0, 0, width, height);

      const marginX = 50, marginY = 30, boardWidth = width - marginX * 2, boardHeight = height - marginY * 2;
      const numFrets = 15, fretWidth = boardWidth / numFrets, stringSpacing = boardHeight / 5;

      // Wood Grain lines
      ctx.fillStyle = 'rgba(255,255,255,0.02)';
      for (let i = 0; i < boardHeight; i += 4) ctx.fillRect(marginX, marginY + i, boardWidth, 1.5);

      if (state.enableFretRange) {
        const startX = marginX + Math.max(0, state.startFret) * fretWidth;
        const endX = marginX + Math.min(15, state.startFret + state.fretSpan) * fretWidth;
        ctx.fillStyle = 'rgba(59, 130, 246, 0.08)';
        ctx.fillRect(startX, marginY, endX - startX, boardHeight);
        ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
        ctx.lineWidth = 2;
        ctx.strokeRect(startX, marginY, endX - startX, boardHeight);
      }

      // Nut
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(marginX - 6, marginY - 2, 6, boardHeight + 4);

      // Inlays
      const inlays = [3, 5, 7, 9, 12, 15];
      ctx.fillStyle = '#3f3f46';
      inlays.forEach(fret => {
        const x = marginX + (fret - 0.5) * fretWidth;
        if (fret === 12) {
          ctx.beginPath();
          ctx.arc(x, marginY + stringSpacing * 1.5, 6, 0, Math.PI * 2);
          ctx.arc(x, marginY + stringSpacing * 3.5, 6, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(x, marginY + boardHeight / 2, 6, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Frets
      ctx.strokeStyle = '#71717a';
      ctx.lineWidth = 2;
      for (let i = 0; i <= numFrets; i++) {
        const x = marginX + i * fretWidth;
        ctx.beginPath(); ctx.moveTo(x, marginY); ctx.lineTo(x, marginY + boardHeight); ctx.stroke();
        if (i > 0) {
          ctx.fillStyle = '#71717a'; ctx.font = '600 11px Inter'; ctx.textAlign = 'center';
          ctx.fillText(i, x - fretWidth / 2, height - 8);
        }
      }

      // Strings
      for (let i = 0; i < 6; i++) {
        const y = marginY + i * stringSpacing;
        ctx.strokeStyle = '#a1a1aa'; ctx.lineWidth = 1 + (i * 0.4);
        ctx.beginPath(); ctx.moveTo(marginX - 6, y); ctx.lineTo(marginX + boardWidth, y); ctx.stroke();
        ctx.fillStyle = '#a1a1aa'; ctx.font = '600 12px Inter'; ctx.textAlign = 'right';
        ctx.fillText(STRING_NAMES[i], marginX - 12, y + 4);
      }

      const chordRoot = (state.key + MAJOR_SCALE[state.degreeIndex]) % 12;
      const intervals = getChordIntervals(state.degreeIndex, state.mode, state.chordType);
      const activeDiatonicRun = state.showDiatonicRun ? getEightDiatonicTriads(voicing) : [];

      // 1. SCALE OVERLAY
      if (state.showScaleOverlay) {
        const activeScaleRoot = state.scaleRoot === 'AUTO' ? chordRoot : Number(state.scaleRoot);
        const scaleIntervals = MODE_INTERVALS[state.selectedScale] || MODE_INTERVALS['ionian'];
        const scalePcs = scaleIntervals.map(i => (activeScaleRoot + i) % 12);

        for (let s = 0; s < 6; s++) {
          const openNote = TUNING[s];
          const y = marginY + s * stringSpacing;
          for (let f = 0; f <= 15; f++) {
            const pc = (openNote + f) % 12;
            if (scalePcs.includes(pc)) {
              const x = f === 0 ? marginX - 18 : marginX + (f - 0.5) * fretWidth;
              ctx.fillStyle = 'rgba(148, 163, 184, 0.25)';
              ctx.beginPath(); ctx.arc(x, y, 11, 0, Math.PI * 2); ctx.fill();
              ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1; ctx.stroke();

              const intervalFromRoot = (pc - activeScaleRoot + 12) % 12;
              ctx.fillStyle = '#cbd5e1'; ctx.font = '600 9px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.fillText(intervalFromRoot, x, y);
            }
          }
        }
      }

      // 2. DIATONIC TRIADS RUN (WITH SPLIT PIE SLICES FOR SHARED NOTES)
      if (state.showDiatonicRun && activeDiatonicRun.length > 0) {
        const noteMap = new Map();
        activeDiatonicRun.forEach(triad => {
          const tIntervals = getChordIntervals(triad.degree, state.mode, state.chordType);
          const tRoot = (state.key + MAJOR_SCALE[triad.degree % 7]) % 12;

          triad.notes.forEach(n => {
            if (state.enableFretRange && (n.fret < state.startFret || n.fret > state.startFret + state.fretSpan)) return;
            const key = `${n.string}:${n.fret}`;
            if (!noteMap.has(key)) {
              const intervalObj = tIntervals.find(i => (tRoot + i.semitones) % 12 === n.pc);
              noteMap.set(key, { string: n.string, fret: n.fret, pc: n.pc, intervalName: intervalObj ? intervalObj.name : 'R', triads: [] });
            }
            noteMap.get(key).triads.push(triad);
          });
        });

        noteMap.forEach(item => {
          const x = item.fret === 0 ? marginX - 18 : marginX + (item.fret - 0.5) * fretWidth;
          const y = marginY + item.string * stringSpacing;
          const numTriads = item.triads.length;

          ctx.shadowColor = 'rgba(0, 0, 0, 0.5)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;

          if (numTriads === 1) {
            ctx.fillStyle = item.triads[0].color;
            ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fill();
          } else {
            const angleStep = (Math.PI * 2) / numTriads;
            item.triads.forEach((triad, idx) => {
              const startAngle = idx * angleStep - Math.PI / 2;
              const endAngle = startAngle + angleStep;
              ctx.fillStyle = triad.color;
              ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, 14, startAngle, endAngle); ctx.closePath(); ctx.fill();
            });
          }

          ctx.shadowBlur = 0; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.stroke();

          ctx.fillStyle = '#ffffff'; ctx.font = '700 11px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(item.intervalName, x, y);
        });
        return;
      }

      // 3. SINGLE CHORD VOICING
      if (!voicing) return;
      voicing.notes.forEach(n => {
        if (state.enableFretRange && (n.fret < state.startFret || n.fret > state.startFret + state.fretSpan)) return;
        const x = n.fret === 0 ? marginX - 18 : marginX + (n.fret - 0.5) * fretWidth;
        const y = marginY + n.string * stringSpacing;
        const intervalObj = intervals.find(i => (chordRoot + i.semitones) % 12 === n.pc);
        let color = '#3b82f6';
        if (intervalObj) {
          if (intervalObj.type === 'root') color = 'var(--root)';
          else if (intervalObj.type === 'third') color = 'var(--third)';
          else if (intervalObj.type === 'fifth') color = 'var(--fifth)';
        }

        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = '#ffffff'; ctx.font = '700 11px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(intervalObj ? intervalObj.name : 'R', x, y);
      });
    }

    function updateApp() {
      const chordName = getChordName(state.key, state.degreeIndex, state.mode, state.chordType);
      const romanList = ROMAN_MAJOR;
      document.getElementById('chordTitle').innerHTML = `${chordName} <span class="chord-badge">${romanList[state.degreeIndex]} Degree</span>`;
      
      const isDiatonic = state.showDiatonicRun;
      document.getElementById('triadLegendContainer').style.display = isDiatonic ? 'block' : 'none';

      if (isDiatonic) {
        const triadLegendBar = document.getElementById('triadLegendBar');
        const notesRowBar = document.getElementById('notesRowBar');
        triadLegendBar.innerHTML = '<span style="font-size:11px; font-weight:700; color:var(--text-muted); margin-right:4px;">8 Diatonic Key:</span>';
        notesRowBar.innerHTML = '<span style="font-size:11px; font-weight:700; color:var(--text-muted); margin-right:4px;">Notes Breakdown:</span>';

        const voicings = generateVoicings(state.key, state.degreeIndex, state.mode, state.chordType, state.enableFretRange, state.startFret, state.fretSpan);
        const run = getEightDiatonicTriads(voicings[state.voicingIndex] || voicings[0]);

        run.forEach(t => {
          const tag = document.createElement('div');
          tag.className = 'triad-tag'; tag.style.backgroundColor = t.color;
          tag.innerText = `${t.roman}: ${t.name}`;
          triadLegendBar.appendChild(tag);

          const sortedNotes = [...t.notes].sort((a, b) => b.string - a.string);
          const noteNamesStr = sortedNotes.map(n => getNoteName(n.pc)).join(' - ');
          const pill = document.createElement('div');
          pill.className = 'note-pill'; pill.style.borderLeft = `3px solid ${t.color}`;
          pill.innerHTML = `<span>${t.roman}</span> <span class="sub">(${noteNamesStr})</span>`;
          notesRowBar.appendChild(pill);
        });
      }

      const degreeContainer = document.getElementById('degreeButtons');
      degreeContainer.innerHTML = '';
      romanList.forEach((deg, idx) => {
        const btn = document.createElement('button');
        btn.className = `btn-degree ${idx === state.degreeIndex ? 'active' : ''}`;
        btn.type = 'button'; btn.innerText = deg;
        btn.onclick = () => { state.degreeIndex = idx; state.voicingIndex = 0; updateApp(); };
        degreeContainer.appendChild(btn);
      });

      const voicings = generateVoicings(state.key, state.degreeIndex % 7, state.mode, state.chordType, state.enableFretRange, state.startFret, state.fretSpan);
      const voicingContainer = document.getElementById('voicingContainer');
      voicingContainer.innerHTML = '';

      if (voicings.length === 0) {
        voicingContainer.innerHTML = '<div style="color:var(--text-muted); font-size:11px; padding:8px;">No playable voicings in range</div>';
      } else {
        if (state.voicingIndex >= voicings.length) state.voicingIndex = 0;
        voicings.forEach((v, idx) => {
          const card = document.createElement('div');
          card.className = `voicing-card ${idx === state.voicingIndex ? 'active' : ''}`;
          const stringsUsed = v.notes.map(n => STRING_NAMES[n.string]).reverse().join('');
          card.innerHTML = `<div class="title">Pos ${v.minFret === 0 ? 'Open' : v.minFret + 'f'} (${stringsUsed})</div><div class="frets">Frets: ${v.notes.map(n => n.fret).join('-')}</div>`;
          card.onclick = () => { state.voicingIndex = idx; updateApp(); };
          voicingContainer.appendChild(card);
        });
      }

      renderFretboard(voicings[state.voicingIndex]);
    }

    // Event Handlers
    document.getElementById('scaleRootSelect').addEventListener('change', (e) => {
      state.scaleRoot = e.target.value;
      if (e.target.value !== 'AUTO') {
        state.key = Number(e.target.value);
        document.getElementById('keySelect').value = state.key;
      }
      updateApp();
    });

    document.getElementById('scaleSelect').addEventListener('change', (e) => { state.selectedScale = e.target.value; updateApp(); });

    document.getElementById('diatonicOnBtn').addEventListener('click', () => {
      state.showDiatonicRun = true;
      document.getElementById('diatonicOnBtn').classList.add('active');
      document.getElementById('diatonicOffBtn').classList.remove('active');
      updateApp();
    });

    document.getElementById('diatonicOffBtn').addEventListener('click', () => {
      state.showDiatonicRun = false;
      document.getElementById('diatonicOffBtn').classList.add('active');
      document.getElementById('diatonicOnBtn').classList.remove('active');
      updateApp();
    });

    document.getElementById('rangeOnBtn').addEventListener('click', () => {
      state.enableFretRange = true;
      document.getElementById('rangeOnBtn').classList.add('active');
      document.getElementById('rangeOffBtn').classList.remove('active');
      document.getElementById('rangeControls').style.display = 'flex';
      updateApp();
    });

    document.getElementById('rangeOffBtn').addEventListener('click', () => {
      state.enableFretRange = false;
      document.getElementById('rangeOffBtn').classList.add('active');
      document.getElementById('rangeOnBtn').classList.remove('active');
      document.getElementById('rangeControls').style.display = 'none';
      updateApp();
    });

    document.getElementById('startFretInput').addEventListener('input', (e) => { state.startFret = parseInt(e.target.value) || 0; updateApp(); });
    document.getElementById('fretSpanInput').addEventListener('input', (e) => { state.fretSpan = parseInt(e.target.value) || 5; updateApp(); });

    document.getElementById('prevChordBtn').addEventListener('click', () => { state.degreeIndex = (state.degreeIndex - 1 + 8) % 8; state.voicingIndex = 0; updateApp(); });
    document.getElementById('nextChordBtn').addEventListener('click', () => { state.degreeIndex = (state.degreeIndex + 1) % 8; state.voicingIndex = 0; updateApp(); });
    document.getElementById('cycleVoicingBtn').addEventListener('click', () => {
      const voicings = generateVoicings(state.key, state.degreeIndex % 7, state.mode, state.chordType, state.enableFretRange, state.startFret, state.fretSpan);
      if (voicings.length > 0) { state.voicingIndex = (state.voicingIndex + 1) % voicings.length; updateApp(); }
    });

    document.getElementById('saveFavBtn').addEventListener('click', () => {
      const chordName = getChordName(state.key, state.degreeIndex, state.mode, state.chordType);
      state.favorites.push({ id: Date.now(), name: chordName, key: state.key, degreeIndex: state.degreeIndex });
      renderFavorites();
    });

    function renderFavorites() {
      const list = document.getElementById('favoritesList');
      if (state.favorites.length === 0) { list.innerHTML = '<div style="font-size: 11px; color: var(--text-muted);">No saved positions yet</div>'; return; }
      list.innerHTML = '';
      state.favorites.forEach(fav => {
        const item = document.createElement('div'); item.className = 'favorite-item';
        item.innerHTML = `<div><strong>${fav.name}</strong></div>`;
        list.appendChild(item);
      });
    }

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const chordName = getChordName(state.key, state.degreeIndex, state.mode, state.chordType);
      const link = document.createElement('a');
      link.download = `${chordName.replace(/\s+/g, '_')}_fretboard.png`;
      link.href = canvas.toDataURL('image/png'); link.click();
    });

    updateApp();
  </script>
</body>
</html>
