<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Chord Studio - Songwriter Progression Tool</title>
  <style>
    :root {
      --bg: #0f0f11;
      --card-bg: #1a1a1e;
      --card-hover: #242429;
      --accent: #f39c12;
      --accent-glow: rgba(243, 156, 18, 0.2);
      --text: #f5f5f7;
      --muted: #8e8e93;
      --border: #2c2c2e;
      --danger: #ff453a;
      --success: #30d158;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom) 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 800px;
      padding: 20px 0 16px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .main-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .panel-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 130px;
    }

    label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
    }

    select, button {
      background: #2c2c2e;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      height: 42px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    button.btn-accent {
      background: var(--accent);
      color: #000;
      border: none;
    }

    button.btn-accent:active {
      opacity: 0.8;
    }

    .toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #2c2c2e;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0 12px;
      flex: 1;
    }

    .toggle-btn.active {
      border-color: var(--success);
      color: var(--success);
      background: rgba(48, 209, 88, 0.12);
    }

    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #2c2c2e;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0 14px;
    }

    .refresh-btn:active {
      background: var(--accent);
      color: #000;
    }

    .progression-slots {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      min-height: 100px;
      align-items: center;
    }

    .chord-slot {
      min-width: 85px;
      height: 90px;
      background: #121214;
      border: 2px dashed var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--accent);
      position: relative;
      flex-shrink: 0;
      transition: transform 0.1s ease, background-color 0.1s ease;
    }

    .chord-slot.active {
      border-style: solid;
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .chord-slot.playing {
      background: var(--accent);
      color: #000;
      transform: scale(1.06);
    }

    .remove-chord {
      position: absolute;
      top: 4px;
      right: 4px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 2px 6px;
      height: auto;
    }

    .empty-msg {
      color: var(--muted);
      font-size: 0.9rem;
      width: 100%;
      text-align: center;
    }

    .presets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
    }

    .preset-card {
      background: #121214;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      text-align: left;
    }

    .preset-card:hover, .preset-card:active {
      border-color: var(--accent);
      background: var(--card-hover);
    }

    .preset-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #fff;
    }

    .preset-chords {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
    }

    .preset-desc {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .category-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      margin: 16px 0 8px;
      grid-column: 1 / -1;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .category-title:first-child {
      margin-top: 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎸 Chord Studio</h1>
  </header>

  <main class="main-container">

    <!-- Builder & Synth Panel -->
    <section class="panel">
      <div class="panel-title">
        <span>Progression Builder</span>
        <span id="current-key-label" style="color: var(--accent); font-size: 0.85rem;">Key: C Major</span>
      </div>

      <!-- Instrument & Tempo Controls -->
      <div class="controls-row">
        <div class="input-group">
          <label for="instrument-select">Sound Instrument</label>
          <select id="instrument-select">
            <optgroup label="Guitars & Keyboard">
              <option value="acoustic">Acoustic Guitar (Picked)</option>
              <option value="strummed">Strummed Acoustic Guitar</option>
              <option value="electric">Electric Clean Guitar</option>
              <option value="piano">8-Bit Piano</option>
              <option value="doubled_piano" selected>Doubled Piano (Two-Handed)</option>
              <option value="toy_piano">Toy Piano</option>
            </optgroup>
            <optgroup label="Orchestral & Strings">
              <option value="violin">Violin</option>
              <option value="viola">Viola</option>
              <option value="cello">Cello</option>
              <option value="bassoon">Bassoon</option>
              <option value="strings">String Section</option>
              <option value="orchestra">Full Orchestra</option>
              <option value="pad">Warm Synth Pad</option>
            </optgroup>
          </select>
        </div>

        <div class="input-group">
          <label for="bpm-select">Tempo (BPM)</label>
          <select id="bpm-select">
            <option value="70">70 BPM (Slow)</option>
            <option value="95" selected>95 BPM (Medium)</option>
            <option value="120">120 BPM (Upbeat)</option>
          </select>
        </div>
      </div>

      <!-- Root & Quality Selector -->
      <div class="controls-row">
        <div class="input-group">
          <label for="root-select">Root Note</label>
          <select id="root-select">
            <option value="C" selected>C</option>
            <option value="C#">C# / Db</option>
            <option value="D">D</option>
            <option value="D#">D# / Eb</option>
            <option value="E">E</option>
            <option value="F">F</option>
            <option value="F#">F# / Gb</option>
            <option value="G">G</option>
            <option value="G#">G# / Ab</option>
            <option value="A">A</option>
            <option value="A#">A# / Bb</option>
            <option value="B">B</option>
          </select>
        </div>

        <div class="input-group">
          <label for="quality-select">Quality</label>
          <select id="quality-select">
            <option value="maj">Major</option>
            <option value="min">Minor</option>
            <option value="7">Dom 7</option>
            <option value="maj7">Maj 7</option>
            <option value="m7">Min 7</option>
            <option value="dim">Dim</option>
            <option value="sus4">Sus4</option>
          </select>
        </div>

        <button class="refresh-btn" id="sync-btn" title="Sync example progressions to current root">
          🔄 Sync Presets
        </button>

        <button class="btn-accent" id="add-chord-btn">+ Add</button>
      </div>

      <!-- Progression Display Slots -->
      <div class="progression-slots" id="slots-container"></div>

      <!-- Action Controls -->
      <div class="controls-row" style="margin-top: 16px; margin-bottom: 0;">
        <button class="btn-accent" id="play-btn" style="flex: 2;">▶ Play Progression</button>
        <button class="toggle-btn" id="loop-btn">🔁 Loop: OFF</button>
        <button id="clear-btn" style="flex: 1; color: var(--danger);">Clear</button>
      </div>
    </section>

    <!-- Presets List -->
    <section class="panel">
      <div class="panel-title">
        <span>Songwriting Progressions (<span id="preset-root-display">Key: C</span>)</span>
      </div>
      <div class="presets-grid" id="presets-grid"></div>
    </section>

  </main>
