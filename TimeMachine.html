<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Machine · Atomic Forge</title><link rel="icon" href="atomic-forge-favicon.png"><link rel="stylesheet" href="practice/practice.css"><style>
#timelineView { overflow-x:auto; }
#timelineTrack { position:relative; box-sizing:content-box; padding:0 22px; }
#timelineRail { position:relative; height:84px; display:flex; align-items:center; }
#seek { width:100%; margin:0; padding:0; }
.loop-marker { position:absolute; top:0; bottom:0; width:44px; transform:translateX(-50%); pointer-events:none; color:#ffc660; }
.loop-marker::before { content:""; position:absolute; left:50%; top:0; bottom:0; border-left:2px solid currentColor; }
.loop-marker span { position:absolute; left:0; width:44px; height:36px; display:grid; place-items:center; background:#412f15; border-radius:6px; touch-action:none; pointer-events:auto; cursor:ew-resize; font-weight:bold; }
#markerB { color:#8ce6ff; }
#markerB span { bottom:0; background:#173841; }
</style></head>
<body><main><header><a href="index.html"><img src="atomic-forge-logo.png" alt="">Atomic Forge</a></header><h1>Time Machine</h1>
<div class="wavebox"><canvas class="wave" id="wave" aria-hidden="true"></canvas><input id="waveColour" type="color" aria-label="Wave colour" title="Change wave colour"></div>
<section class="panel"><div class="row"><label>Recording<input type="file" id="file" accept="audio/*,.m4a,.mp3,.wav,.flac"></label><strong id="track"></strong></div>
<audio id="audio" preload="auto"></audio><p id="position">0:00.00</p><div id="timelineView"><div id="timelineTrack"><div id="timelineRail"><input type="range" id="seek" min="0" max="1" step=".01" value="0" aria-label="Recording position" disabled>
<div class="loop-marker" id="markerA" hidden><span>A</span></div>
<div class="loop-marker" id="markerB" hidden><span>B</span></div>
</div></div></div>
<label>Timeline zoom <output id="zoomValue">1×</output><input type="range" id="zoom" min="1" max="32" value="1" disabled></label>
<div class="row"><button id="setA">Set A</button><button id="setB">Set B</button><button id="clearLoop" disabled>Clear loop points</button><label>Speed<select id="speed"></select></label><button class="primary" id="play">Play</button><button id="restart">Replay from A</button></div>
<p id="status" class="status" role="status">Choose a recording or open a saved phrase.</p></section>
<section class="panel"><h2>Loop settings</h2><div class="row"><label>A · seconds<input id="a" type="number" min="0" step=".01" value="0"></label><label>B · seconds<input id="b" type="number" min="0" step=".01" value="0"></label><label>Practice mode<select id="mode"><option value="loop">Loop</option><option value="reply">Listen / My turn</option></select></label><label>My turn length<select id="reply"><option value="1">1 phrase</option><option value="2">2 phrases</option></select></label></div>
<div class="row"><label>Count-in beats<input id="count" type="number" min="0" max="8" value="0"></label><label>Count-in BPM<input id="bpm" type="number" min="30" max="300" value="90"></label><label>Speed increase per loop<select id="step"><option value="0">Off</option><option value="2">2%</option><option value="5">5%</option><option value="10">10%</option></select></label></div></section>
<section class="panel"><h2>Phrase library</h2><div class="row"><label>Phrase name<input id="name" placeholder="Solo turnaround"></label><button id="save">Save phrase</button><label>Saved on this device<select id="library"><option value="">Choose a phrase</option></select></label></div><label>Fingering or practice notes<textarea rows="2" id="notes"></textarea></label></section>
<details class="panel"><summary>MIDI footswitches</summary><div class="row"><label>Action<select id="action"><option value="setA">Set A</option><option value="setB">Set B</option><option value="play">Play / pause</option><option value="restart">Replay from A</option><option value="mode">Toggle response mode</option></select></label><button id="connectMidi">Connect MIDI</button><button id="learn">Learn switch</button></div><small id="midiStatus" role="status"></small></details>
</main><script src="practice/common.js"></script><script src="practice/time.js"></script></body></html>
